<!DOCTYPE html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-light" lang="en"> <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Laine's Links</title>
    <link rel="icon" type="image/png" href="images/favicon.png"> <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="I'm Laine -- a freelance book designer and video editor! Here you can find all the different places on the internet that I am on.">

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://links.lainesdesigned.com/">

    <!-- Author Information -->
    <meta name="author" content="Laine Zvirgzdiņa">

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta name="theme-color" content="#db4f00" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#db4f00" media="(prefers-color-scheme: dark)">

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="Laine's Links">
    <meta property="og:description" content="A link of all links for Laine's internet places.">
    <meta property="og:url" content="https://links.lainesdesigned.com">
    <meta property="og:image" content="https://yourwebsite.com/images/avatar.png">
    <meta name="twitter:card" content="summary">
    

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link rel="preload" href="fonts/Figtree-VariableFont_wght.ttf" as="font" type="font/truetype" crossorigin>
    <link rel="preload" href="fonts/Figtree-Italic-VariableFont_wght.ttf" as="font" type="font/truetype" crossorigin>
    <link rel="preload" href="fonts/quiche-display-bold.ttf" as="font" type="font/truetype" crossorigin>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">
          <main>

            <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <img class="avatar avatar--soft" src="images/avatar.png" srcset="images/avatar.png" alt="LittleLink" width="128" height="128" fetchpriority="high">

            <!-- Replace with your name or brand -->
            <h1>@lainesdesigned</h1>

            <!-- Add a short description about yourself or your brand -->
            <p>freelance book designer & video editor</p>

            <!-- All your buttons go here -->
            <nav class="button-stack" aria-label="Links">


              <!-- Generic Website -->
              <a class="button button-default" href="https://lainesdesigned.com/" target="_blank" rel="noopener">Website</a>

              <!-- Generic Blog -->
              <a class="button button-default-alt" href="https://garden.lainesdesigned.com/" target="_blank" rel="noopener">Digital Garden</a>

              <h2>Videos</h2>
              <!-- YouTube Alt -->
              <a class="button button-yt" href="https://youtube.com/@lainesdesigned" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/youtube.svg" alt="YouTube Logo">YouTube</a>

              <!-- Twitch -->
              <a class="button button-twitch" href="https://twitch.tv/lainesdesigned" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/twitch.svg" alt="Twitch Logo">Twitch</a>

              <h2>Social Media</h2>
              <!-- Bluesky -->
              <a class="button button-bluesky-alt" href="https://shinenite.lainesdesigned.com/" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/bluesky-alt.svg" alt="Bluesky Logo">Bluesky</a>

              <!-- LinkedIn -->
              <a class="button button-linked" href="https://linkedin.com/in/lainesdesigned" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

              <h2>Contact</h2>
              <!-- Generic Email Alt -->
              <a class="button button-default" href="mailto:hello@lainesdesigned.com" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/generic-email-alt.svg" alt="Email Icon">Email</a>

            </nav>   
      </main>

      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        Check source code <a href="https://github.com/Shinenite/littlelink" target="_blank" rel="noopener">here</a>
      </footer>

    </div>
  </div>

</body>

</html>
